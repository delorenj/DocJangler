[project]
name = "doc-jangler"
version = "0.1.0"
description = "Scrape and index API docs with gusto"
readme = "README.md"
authors = [
    { name = "Jarad DeLorenzo", email = "jaradd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.3",
    "firecrawl>=4.3.6",
    "huggingface>=0.0.1",
    "huggingface-hub>=0.35.1",

    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "typer>=0.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.20",
]

[project.scripts]
doc-jangler = "doc_jangler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
]
